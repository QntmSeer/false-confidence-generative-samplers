[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "false-confidence"
version = "0.1.0"
description = "Diagnostic benchmarks and bidirectional audits exposing mode collapse in generative physical samplers."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Karthik Gangadharaiah" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]
exclude = ["data*", "paper*", "audit_reports*"]

[tool.ruff]
line-length = 100
target-version = "py311"
